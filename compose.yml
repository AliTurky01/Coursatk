services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
    command: sh -c "echo '🚀 Application available at http://localhost:8000' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
